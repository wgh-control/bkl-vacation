apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: bkl-vacation-vault
  labels:
    app.kubernetes.io/name: bkl-vacation
    app.kubernetes.io/component: vault
    app.kubernetes.io/part-of: bkl-vacation
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    vault:
      server: https://placeholder-vault-host.invalid
      path: placeholder-vault-mount
      version: v2
      auth:
        kubernetes:
          mountPath: placeholder-vault-k8s-auth-mount
          role: placeholder-vault-role
          serviceAccountRef:
            name: bkl-vacation-vault
