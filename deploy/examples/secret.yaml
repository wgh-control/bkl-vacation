# Example only. Not part of the Kustomize build.
# Create a Secret with this name and these keys in the portal namespace
# before the first sync. Deliver it with the mechanism the cluster already
# uses. Values stay out of git. Replace every placeholder value.
apiVersion: v1
kind: Secret
metadata:
  name: bkl-vacation
  namespace: placeholder-namespace
type: Opaque
stringData:
  DATABASE_URL: "placeholder-database-url"
  KEYCLOAK_CLIENT_SECRET: "placeholder-keycloak-client-secret"
  SMTP_USERNAME: "placeholder-smtp-username"
  SMTP_PASSWORD: "placeholder-smtp-password"
