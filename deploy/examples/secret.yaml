# Key names for the runtime Secret. Not a manifest to apply, and not part
# of the Kustomize build. No values belong in this file.
#
# External Secrets writes Secret bkl-vacation from Vault KV v2
# placeholder-vault-mount, path bkl-vacation/runtime.
# Until that Vault path is connected, set the same names as masked
# GitLab CI/CD variables. The full list is in deploy/README.md.
#
# Keys:
#   DATABASE_URL
#   KEYCLOAK_CLIENT_SECRET
#   SMTP_USERNAME
#   SMTP_PASSWORD
