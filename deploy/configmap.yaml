apiVersion: v1
kind: ConfigMap
metadata:
  name: bkl-vacation
  labels:
    app.kubernetes.io/name: bkl-vacation
    app.kubernetes.io/part-of: bkl-vacation
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  # Non-secret settings. Replace every placeholder before the first sync.
  # Key names are the contract the API and the worker read. See deploy/README.md.
  HTTP_ADDR: ":8080"
  STATIC_DIR: "/app/static"
  LOG_LEVEL: "info"
  KEYCLOAK_ISSUER: "https://placeholder.invalid/realms/placeholder-realm"
  KEYCLOAK_CLIENT_ID: "placeholder-client-id"
  KEYCLOAK_HR_GROUP: "placeholder-hr-group"
  SMTP_HOST: "placeholder.invalid"
  SMTP_PORT: "placeholder-smtp-port"
  SMTP_TLS: "placeholder-smtp-tls"
  SMTP_FROM: "placeholder@placeholder.invalid"
