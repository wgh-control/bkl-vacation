apiVersion: batch/v1
kind: Job
metadata:
  name: bkl-vacation-migrate
  labels:
    app.kubernetes.io/name: bkl-vacation
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: bkl-vacation
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bkl-vacation
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: bkl-vacation
    spec:
      serviceAccountName: bkl-vacation
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: bkl-vacation
          imagePullPolicy: IfNotPresent
          command: ["/app/api", "migrate"]
          envFrom:
            - configMapRef:
                name: bkl-vacation
            - secretRef:
                name: bkl-vacation
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
